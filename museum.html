<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnPuzzled | Museum</title>
    
    <link rel="icon" href="images/favicon.png">
    <script src="./museum.js" defer></script>
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="style.css"> <!-- CSS -->
</head>
<body>

    <header>
        <nav>
            <div class="logo">UnPuzzled</div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="game.html">Puzzle Game</a></li>
                <li><a href="museum.html">Museum</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="page-banner">
            <h1>Museum Collection</h1>

            <p>
                Unlock masterpieces by completing their puzzles.
            </p>
        </section>

        <section class="museum-progress">

            <h2>Collection Progress</h2>

            <div class="progress-card">
                <p>
                    Restored Masterpieces:
                    <span id="museum-counter">0 / 10</span>
                </p>
            </div>

        </section>

        <section class="museum-gallery">

            <h2>Grand Gallery</h2>

            <div class="museum-grid" id="museum-grid"></div>

        </section>

    </main>
    <footer>
        <p id="footerLocation">📍 Calgary</p>
        <div id="weatherInfo">

            <p id="footerTemperature">
                Loading weather...
            </p>

            <p id="footerCondition"></p>

            <p id="footerTime"></p>

            <p id="footerDayNight"></p>

        </div>
        <div>
            <p>
                    © <span id="year"></span>
                    Sebastian Garcia Velez | UnPuzzled
            </p>
            <a href="https://github.com/sebastiangv">GitHub</a>
            <a href="https://www.linkedin.com/in/sebastian-garcia-velez/">LinkedIn</a>
        </div>
